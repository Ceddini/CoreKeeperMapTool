# Core Keeper Map Tool: nginx server block for the static build in /var/www/maptool (dist/).
# Adjust server_name, root and TLS to your setup.

server {
    listen 443 ssl;
    http2 on;
    server_name maptool.ceschmitt.de;
    root /var/www/maptool;
    index index.html;

    # ---- Security headers. Everything is same-origin: no ads, analytics or CDNs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ---- Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- HTML, service worker and manifest must always be revalidated so updates arrive.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location ~* ^/(index\.html|privacy\.html|manifest\.webmanifest|theme-init\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; manifest-src 'self'" always;
        try_files $uri =404;
    }

    # ---- The example map is already gzip-compressed data: serve the bytes as-is.
    location ~* \.gzip$ {
        gzip off;
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ---- Old URLs from the previous version.
    location = /privacy-policy.html { return 301 /privacy.html; }
    location = /index.htm { return 301 /; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name maptool.ceschmitt.de;
    return 301 https://$host$request_uri;
}
